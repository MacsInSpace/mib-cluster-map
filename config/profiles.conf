train MHI2_US_AU57x_K3341 map navignore
# VWG11: NavActiveIgnore stops CarPlay connecting (#62, #106, #111), so the
# CarPlay map keeps the cockpit on a route with hidenav instead.
# K3342 carplay857735: wired CarPlay map on aciftci19's car (#62) and
# LemurLogic's (#111, with route guidance and hidenav).
# K3342 infok3342: checked against aciftci19's K3342 lsd.jxe (#62,
# 2026-11-20). No ExBox guidance, no Baidu CarLife, two station-info fields
# renamed and another smartphone-integration property (879176704) than the
# Golf's: the Golf-based music jar would not load its Android Auto start-up
# there. The K3342 build resolves every stock reference in that lsd.jxe.
train MHI2_ER_VWG11_K3342 map carplay857735 hidenav infok3342
train MHI2_ER_VWG11_K3332 map hidenav
train MHI2_ER_VWG11_P3301 map hidenav
# P3657 (Golf GTE, MU1077): Mkrogh-2026's CarPlay map stayed on the cockpit
# with Google Maps, Apple Maps and Waze only with the route hidden (#100).
train MHI2_ER_VWG13_P3657 hidenav
train _VWG11_S nonavignore

# ---- make: settings owners settled on, by train pattern ---------------------
#   make PATTERN NAME WINDOW DPI INSETS CONTEXT [fullframe]
# PATTERN is a shell pattern. Once the installer knows the window, a line
# whose pattern and WINDOW both match wins; otherwise the first pattern match,
# whose WINDOW is the guess when the display manager does not report one.
# fullframe: CLUSTERMAP_FULL_FRAME=auto means 1 on this car and window. DPI and INSETS fill in
# "auto" in gal_dualscreen.conf; INSETS are top,bottom,left,right. CONTEXT is
# the cockpit's map context. Values: docs/Install.md.
make *_SEG* SEAT 1010x376 125 105,127,127,127 70
make *_SKG* Skoda 1010x376 125 40,127,127,127 70
make *_VW* VW 800x480 138 52,82,127,127 70
# Tiguans on P4521 with the 1010x376 cockpit: brzeskibartosz's values (#95,
# full frame, turn card visible; ETA card not yet), also #137.
make *_VW* VW 1010x376 115 102,52,127,127 70 fullframe
make *_AUG22_* Audi 1440x455 140 40,40,127,127 72
# A3 8V: window, DPI and margins from kashavsehra's tuning (#51, #78: tuned
# with CLUSTERMAP_FULL_FRAME=1); context 70 (72 and 33 changed nothing on
# his car).
make *_AU37x_* Audi 1440x455 100 60,150,10,10 70
# A7 C7.5: 800x298 window (display manager), context 73, the shipped DPI and
# insets: Seif's beta21 trial ran with these.
make *_AU57x_* Audi 800x298 125 40,40,127,127 73
