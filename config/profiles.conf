# What this project knows about each firmware. This is the only file a new
# car should need: no rebuild, nothing else to edit. See docs/Development.md,
# "Adding a firmware". Read by the hook, the installer and the green menu.
#
# Fields are separated by spaces. Keep every line in the plain form below.

# ---- profile: one Android Auto program (gal) build ------------------------
# The hook, and profile_check at install time, pick the line whose first three
# addresses match this unit's gal. A different train with the same gal build
# uses the same line, so trains are not listed here. No match: Android Auto
# stays stock.
#
#   profile NAME TESTED CONTROLLER IMPL_VT CB_VT CTOR FIRST_WORD SIZE CTL_CFG
#           CTL_CREATOR H_COUNT H_DATA ENTRY SET_FIRST SET_LAST DISPLAYABLE
#
# TESTED is 1 once it has run on a car. Numbers are hex, DISPLAYABLE decimal.
# gal_hook checks CTOR's first instruction word against FIRST_WORD before use.
profile MHI2_ER_VWG13_P4521 1 237f70 231e08 231d18 1d9658 e92d4ff0 f0 94 c4 80 84 28 34 58 59
profile MHI2_ER_SEG11_P4708 1 237f68 231e00 231d10 1d9650 e92d4ff0 f0 94 c4 80 84 28 34 58 59
profile MHI2_ER_SEG11_P4709 1 238570 232408 232318 1d9ac0 e92d4ff0 f0 94 c4 80 84 28 34 58 59
profile MHI2_ER_VWG13_P4512 1 237f78 231e10 231d20 1d9660 e92d4ff0 f0 94 c4 80 84 28 34 58 59
profile MHI2_ER_SKG13_P4526 1 2385c0 232458 232368 1d9ac0 e92d4ff0 f0 94 c4 80 84 28 34 58 59
profile MHI2_ER_AUG22_K3346 1 22c8b4 228e90 228da0 1d6640 e92d4ff0 e8 88 b8 78 7c 28 34 58 59
profile MHI2_ER_VWG11_K3342 1 22cd64 229340 229250 1d69b8 e92d4ff0 e8 88 b8 78 7c 28 34 58 59
