# ---- train: what is known about one firmware train -------------------------
#   train SUBSTRING WORD...
# Matched as a substring of the unit's train, so _1 re-releases count.
#   map          the map is car-tested on this train
#   navignore    the installer may add NavActiveIgnore here by itself
#   nonavignore  never add NavActiveIgnore here: it broke Android Auto
#   arrows       the turn-arrows jar is known to work here
# A train with no line still installs if its gal matches a profile above.
train MHI2_ER_VWG13_P4521 map navignore arrows
# K4525 runs the P4521 profile unchanged (two owners, #5).
train MHI2_ER_VWG13_K4525 map navignore arrows
train MHI2_ER_VWG13_P4512 map navignore
# P4174: NavActiveIgnore kept the map on a route (pedrra, #49).
train MHI2_ER_VWG13_P4174 map navignore
train MHI2_US_VWG13_P3662 map navignore
train MHI2_ER_SEG11_P4708 map arrows
train MHI2_ER_SEG11_P4709 map navignore arrows
train MHI2_ER_SKG13_P4526 map navignore
# P4523 has P4709's gal build. Map confirmed by Hancea91 (#56).
train MHI2_ER_SKG13_P4523 map
train MHI2_ER_AUG22_K3346 map nonavignore
# P5089: map works (#51); NavActiveIgnore not yet tried on this Audi, so it
# is neither added by itself nor refused.
train MHI2_ER_AU37x_P5089 map
# K3663: lsd.sh names every boot jar itself, so the installer cannot add
# NavActiveIgnore there yet; nothing to refuse either.
train MHI2_ER_AU57x_K3663 map
train MHI2_ER_VWG11_K3342 map
train MHI2_ER_VWG11_P3301 map
train _VWG11_S nonavignore

# ---- make: settings owners settled on, by train pattern ---------------------
#   make PATTERN NAME WINDOW DPI INSETS CONTEXT
# PATTERN is a shell pattern; the first match wins. WINDOW is used only when
# the display manager does not report the window. DPI and INSETS fill in
# "auto" in gal_dualscreen.conf; INSETS are top,bottom,left,right. CONTEXT is
# the cockpit's map context. Values: docs/Install.md.
make *_SEG* SEAT 1010x376 125 105,127,127,127 70
make *_SKG* Skoda 1010x376 125 40,127,127,127 70
make *_VW* VW 800x480 138 52,82,127,127 70
make *_AUG22_* Audi 1440x455 140 40,40,127,127 72
# A3 8V: window, DPI and margins from kashavsehra's tuning (#51); context 70
# (72 and 33 changed nothing on his car).
make *_AU37x_* Audi 1440x455 140 40,40,127,127 70
# A7 C7.5: context 73 (Seif). Window not known yet ("-": the display
# manager's size, else 800x480), so DPI and insets stay the shipped defaults.
make *_AU57x_* Audi - 125 40,40,127,127 73
