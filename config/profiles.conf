# ---- train: what is known about one firmware train -------------------------
#   train SUBSTRING WORD...
# Matched as a substring of the unit's train, so _1 re-releases count.
#   map          the map is car-tested on this train
#   navignore    the installer may add NavActiveIgnore here by itself
#   nonavignore  never add NavActiveIgnore here: it broke Android Auto
#   arrows       the turn-arrows jar is known to work here
#   info         only the music and turn-info builds of that jar
#                (CLUSTERMAP_MUSIC_INFO, CLUSTERMAP_TURN_INFO) may go on here:
#                every stock method and field they use was found, with the
#                same signature, in this train's lsd.jxe. Not car-tested.
#                The full arrows jar (CLUSTERMAP_KEEP_ARROWS) stays off.
#   infok3342    the music and turn-info builds made for K3342's older stock
#                code (VCAndroidAutoMusic_K3342.jar, VCAndroidAutoTurns_K3342.jar,
#                fork variants/k3342.sh, compiled against that train's lsd.jxe)
#                go on here instead of the Golf builds. Not car-tested.
#   wheelzoom    the steering-wheel roller zooms the CarPlay map: ClusterMapWheelZoom.jar
#                fits this train's interface (also checked by lsd.jxe's size)
#   navasiazoom  the same for the Asia navigation: ClusterMapNavAsiaZoom.jar
#   carplay<size> this train's CarPlay library of <size> bytes is car-tested
#                with the CarPlay map, though the size is not accepted on
#                every train (CLUSTERMAP_CARPLAY_TRIAL is then not needed)
#   hidenav      CarPlay: the iPhone's route is hidden from the car by default
#                (CLUSTERMAP_CARPLAY_HIDE_NAV), because NavActiveIgnore cannot
#                be used with CarPlay here
#   hwdecode     GAL_PLAYER_DECODER=auto means hw here: the unit's own video
#                decoder passed the green menu's Hardware decoder check and
#                real sessions on a car of this train. Everywhere else auto
#                means sw. An owner's own sw or hw always wins.
# A train with no line still installs if its gal matches a profile above.
# P4521 hwdecode: Golf, 2026-11-17 (30 pictures a second on a third of the
# processor time, by cable and through a wireless adapter).
train MHI2_ER_VWG13_P4521 map navignore arrows hwdecode
# K4525 runs the P4521 profile unchanged (two owners, #5).
# K4525 hwdecode: decoder check "usable" and the switch on, working
# (DannAberHardt, discussion #135, v1.2.7).
train MHI2_ER_VWG13_K4525 map navignore arrows hwdecode
# P4512 info: checked against luketench's P4512_1 lsd.jxe (#24). Its
# BAPString.setContent returns void, which the jars already allow for.
train MHI2_ER_VWG13_P4512 map navignore info
# P4174: NavActiveIgnore kept the map on a route (pedrra, #49).
train MHI2_ER_VWG13_P4174 map navignore
train MHI2_US_VWG13_P3662 map navignore
train MHI2_ER_SEG11_P4708 map arrows
train MHI2_ER_SEG11_P4709 map navignore arrows
# P4526 info: checked against pepsonEL's lsd.jxe (#69); the classes the jars
# replace are identical to P4521's.
train MHI2_ER_SKG13_P4526 map navignore info
# P4523 has P4709's gal build. Map confirmed by Hancea91 (#56).
train MHI2_ER_SKG13_P4523 map
# K3346 also on a Q5 FY (#96, v1.2.1).
train MHI2_ER_AUG22_K3346 map
# K3344 is K3346's software under an older name on MU1438: wiskiw compared the
# two update packages file by file (#14), and its gal matches K3346's profile.
train MHI2_ER_AUG22_K3344 map
# P5089: map works (#51); NavActiveIgnore not yet tried on this Audi, so it
# is neither added by itself nor refused.
train MHI2_ER_AU37x_P5089 map
# P5153: same gal as P5089; map and sharper picture confirmed on v1.2.8 (#155).
train MHI2_ER_AU37x_P5153 map
# P4203: map works with the trial line (#81); NavActiveIgnore as on P5089.
train MHI2_ER_AU37x_P4203 map
# K3663: navignore adds the Audi build of NavActiveIgnore (M.I.B.'s,
# thirdparty/navactiveignore-audi), the one an A7 C7.5 runs with the map and
